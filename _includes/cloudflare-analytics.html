{% assign analytics_token = site.cloudflare_web_analytics_token | default: '' | strip %}
{% if jekyll.environment == 'production' and analytics_token != '' %}
<!-- Cloudflare Web Analytics -->
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": {{ analytics_token | jsonify | escape }}}'></script>
<!-- End Cloudflare Web Analytics -->
{% endif %}
