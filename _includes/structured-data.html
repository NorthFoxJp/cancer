<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "{{ page.schema_type | default: 'WebPage' }}",
  "name": {{ page.title | default: site.title | jsonify }},
  {% if page.schema_type == 'BlogPosting' %}"headline": {{ page.title | jsonify }},{% endif %}
  "description": {{ include.page_description | strip_html | normalize_whitespace | jsonify }},
  "url": {{ include.canonical_url | jsonify }},
  "inLanguage": "ja",
  {% if page.schema_type == 'BlogPosting' %}
  "datePublished": {{ page.original_published | jsonify }},
  "dateModified": {{ page.original_updated | default: '2025-12-07T17:05:36+09:00' | jsonify }},
  "author": {"@type": "Person", "name": "北きつね", "url": "https://northfoxjp.blogspot.com/"},
  "publisher": {"@type": "Person", "name": "北きつね"},
  "isBasedOn": {{ page.source_url | jsonify }},
  "mainEntityOfPage": {"@type": "WebPage", "@id": {{ include.canonical_url | jsonify }}},
  {% endif %}
  "isPartOf": {"@type": "WebSite", "name": {{ site.title | jsonify }}, "url": "https://northfoxjp.github.io/cancer/"}
}
</script>
{% unless page.url == '/' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {"@type": "ListItem", "position": 1, "name": "ホーム", "item": "https://northfoxjp.github.io/cancer/"}{% if page.breadcrumb_parent_title %},
    {"@type": "ListItem", "position": 2, "name": {{ page.breadcrumb_parent_title | jsonify }}, "item": {{ site.url | append: site.baseurl | append: page.breadcrumb_parent_url | jsonify }}},
    {"@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }}, "item": {{ include.canonical_url | jsonify }}}{% else %},
    {"@type": "ListItem", "position": 2, "name": {{ page.title | jsonify }}, "item": {{ include.canonical_url | jsonify }}}{% endif %}
  ]
}
</script>
{% endunless %}
