---
layout: default
---
<article class="hub-page">
  <header class="record-header">
    {% if page.stage %}<p class="eyebrow">{{ page.stage }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </header>
  {% if page.patient_notice %}{% include patient-notice.html %}{% endif %}
  <div class="record-body">{{ content }}</div>
</article>
